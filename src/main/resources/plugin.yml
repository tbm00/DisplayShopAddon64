name: DisplayShopAddon64
version: ${project.version}
description: ${project.description}
author: tbm00
main: dev.tbm00.spigot.displayshopaddon64.DisplayShopAddon64
api-version: 1.17
depend: [DisplayShops, Vault, Rep64]
commands:
  testshop:
    description: Main command for DisplayShopAddon64
  testbuy:
    description: Additional command for DisplayShopAddon64
  testsell:
    description: Additional command for DisplayShopAddon64
  testsellinv:
    description: Additional command for DisplayShopAddon64
    aliases: [testsellall]
  testsellgui:
    description: Additional command for DisplayShopAddon64
    aliases: [testsellg, testsg]
  testshopadmin:
    description: Admin commands for DisplayShopAddon64
permissions:
  displayshopaddon64.player:
    description: Ability to use player commands
    default: true
  displayshopaddon64.player.money-move:
    description: Ability to store money into shops with command
    default: true
  displayshopaddon64.player.store-inv:
    description: Ability to store inv items into shops with command
    default: true
  displayshopaddon64.player.sell-inv:
    description: Ability to sell inv items with command
    default: true
  displayshopaddon64.player.sell-gui:
    description: Ability to open sell GUI with command
    default: true
  displayshopaddon64.admin:
    description: Ability to use admin commands
    default: op